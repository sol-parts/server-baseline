---
# Логи сайту лежать поза /var/log, тож дистрибутивні правила їх не бачать.
# Без ротації тека логів росте до заповнення диска — і сервер стає непридатним
# раніше, ніж хтось помітить проблему.
- name: Ротація логів сайту
  ansible.builtin.template:
    src: logrotate-site.j2
    dest: "/etc/logrotate.d/sol-{{ sol_app_name }}"
    mode: "0644"
