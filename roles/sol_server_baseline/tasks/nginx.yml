---
- name: Репозиторій nginx.org (stable)
  ansible.builtin.yum_repository:
    name: nginx-stable
    description: nginx stable repo
    baseurl: "https://nginx.org/packages/centos/{{ ansible_distribution_major_version }}/$basearch/"
    gpgcheck: true
    gpgkey: https://nginx.org/keys/nginx_signing.key
    module_hotfixes: true
    enabled: true
  when: sol_nginx_use_upstream_repo | bool

- name: nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

# nginx віддає статику з теки сайту напряму, тож потребує прав групи власника.
# Членство в групі читається при запуску воркерів, тому досить reload.
- name: Додати nginx до групи {{ sol_site_group }}
  ansible.builtin.user:
    name: nginx
    groups: "{{ sol_site_group }}"
    append: true
  notify: Reload nginx

- name: Тека під vhost-и
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: "0755"

# Пакетний default.conf займає порт 80 для будь-якого імені та перекриває
# сайт, поки TLS ще не випущено.
- name: Прибрати дефолтний vhost
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

# Параметри, які мають сенс лише на рівні http {} — окремим файлом, щоб не
# переписувати /etc/nginx/nginx.conf і не заважати іншим сайтам на сервері.
- name: Загальні параметри http
  ansible.builtin.template:
    src: nginx-sol.conf.j2
    dest: /etc/nginx/conf.d/00-sol.conf
    mode: "0644"
  notify: Reload nginx

# Потрібні лише для DHE-шифрів у TLS 1.2 (у переліку Mozilla intermediate вони
# є). Генеруємо на місці: creates робить задачу одноразовою.
- name: Параметри Diffie-Hellman
  ansible.builtin.command: openssl dhparam -out /etc/nginx/dhparams.pem 2048
  args:
    creates: /etc/nginx/dhparams.pem
  notify: Reload nginx

- name: Чи вже випущено сертифікат
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ sol_site_domain }}/privkey.pem"
  register: sol_tls_cert

- name: Запам'ятати наявність сертифіката
  ansible.builtin.set_fact:
    sol_tls_available: "{{ sol_tls_cert.stat.exists }}"

- name: Vhost {{ sol_site_domain }}
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/conf.d/{{ sol_site_domain }}.conf"
    mode: "0644"
  notify: Reload nginx

- name: Увімкнути й запустити nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
