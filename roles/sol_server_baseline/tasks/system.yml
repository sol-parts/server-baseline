---
- name: Часова зона {{ sol_timezone }}
  community.general.timezone:
    name: "{{ sol_timezone }}"

- name: Репозиторій EPEL і плагіни dnf
  ansible.builtin.dnf:
    name:
      - epel-release
      # dnf config-manager живе тут; на мінімальній інсталяції його немає
      - dnf-plugins-core
    state: present

# CRB (CodeReady Builder) вимкнено в EL9 за замовчуванням, а частина утиліт для
# роботи із зображеннями лежить тільки там (див. libwebp-tools нижче).
- name: Увімкнути репозиторій CRB
  ansible.builtin.command: dnf config-manager --set-enabled crb
  changed_when: false

- name: Базові пакети
  ansible.builtin.dnf:
    name:
      # Робота з файлами постачальників: прайси приходять у zip/7z/xlsx
      - unzip
      - zip
      - p7zip
      - p7zip-plugins
      - tar
      - zstd
      # Обробка зображень товарів
      - ImageMagick
      - jpegoptim
      # Синхронізація фото в об'єктне сховище (команда бекапу зображень)
      - rclone
      # Обслуговування
      - git
      - rsync
      - logrotate
      - firewalld
      - bind-utils
      - python3-pip
      # Модуль ansible pip нижче: в образі AlmaLinux 10 немає ні її, ні setuptools
      - python3-packaging
    state: present

# enca (визначення кодування текстових прайсів) є лише в EPEL 9. На EL10 її немає,
# і платформа без неї працює: кодування тоді визначає PHP-перевірка UTF-8 і
# mb_detect_encoding. p7zip/p7zip-plugins на EL10 дають пакети 7zip-standalone і 7zip.
- name: Визначення кодування прайсів enca (лише EL9)
  ansible.builtin.dnf:
    name: enca
    state: present
  when: ansible_distribution_major_version == '9'

# webpmux потрібен команді, що зрізає EXIF із webp. libwebp приїжджає
# залежністю ImageMagick, але це бібліотека — самі утиліти лежать окремим
# пакетом і тільки в CRB, тому окремою задачею з enablerepo.
- name: Утиліти libwebp (webpmux)
  ansible.builtin.dnf:
    name: libwebp-tools
    state: present
    enablerepo: crb

# Легасі-імпорт прайсів викликає /usr/local/bin/xlsx2csv для великих xlsx,
# які не варто тягнути в пам'ять PHP.
- name: xlsx2csv
  ansible.builtin.pip:
    name: xlsx2csv
    state: present
    executable: pip3
